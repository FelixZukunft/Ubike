[project]
name = "ubike"
version = "0.1.0"
description = "YouBike Optimizer Taipei – phone app with live data and a 36 h forecast"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pyyaml>=6",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.scripts]
ubike = "ubike.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
    